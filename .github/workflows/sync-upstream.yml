name: Sync upstream

on:
  schedule:
    - cron: '34 12 * * 5' # Friday 12:34 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'faketrader/lark-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync the latest upstream release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(gh api repos/larksuite/cli/releases/latest --jq '.tag_name')
          git -c http.https://github.com/.extraheader= fetch --no-tags \
            https://github.com/larksuite/cli.git "refs/tags/$release_tag"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/sync-upstream.sh FETCH_HEAD "$release_tag"
          git push origin HEAD:refs/heads/main
